  # workflow_dispatch:
   

jobs:
  Test-run:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source code
      
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli sfdx-cli

      - name: Get Commit Message
        id: get_commit_message
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit Message: $COMMIT_MSG"

          TEST_CLASS_TYPE=""

          if [[ "$COMMIT_MSG" == *"RunSpecifiedTest"* ]]; then
            TEST_CLASSES=$(echo "$COMMIT_MSG" | sed -n 's/RunSpecifiedTest //p' | xargs)
            TEST_CLASS_TYPE="-l RunSpecifiedTests"
            if [[ -n "$TEST_CLASSES" ]]; then
              IFS=',' read -ra TEST_ARRAY <<< "$TEST_CLASSES"
              for test in "${TEST_ARRAY[@]}"; do
                TEST_CLASS_TYPE+=" --tests $test"
              done
            fi 
            TEST_CLASS_TYPE+=" --dry-run"

          elif [[ "$COMMIT_MSG" == *"RunLocalTest"* ]]; then
            TEST_CLASS_TYPE="-l RunLocalTests --dry-run"
          else
            TEST_CLASS_TYPE="--dry-run"
          fi

          echo "Final Test Class Type: $TEST_CLASS_TYPE"
          echo "TEST_TYPE=$TEST_CLASS_TYPE" >> "$GITHUB_ENV"

